const KW=(LESSON.keep||LESSON.words||[]).slice().sort((a,b)=>b.length-a.length);
const keep=t=>{ for(const w of KW) t=t.split(w).join('\u0001'+KW.indexOf(w)+'\u0002'); return t.replace(/\u0001(\d+)\u0002/g,(m,i)=>'<span class="notranslate kw" translate="no">'+KW[+i]+'</span>'); };
const rich=t=>keep(String(t==null?'':t)).replace(/\*\*(.+?)\*\*/g,'<b class="hl">$1</b>').replace(/\n/g,'<br>');
const plain=t=>String(t==null?'':t).replace(/\*\*/g,'').replace(/\{\d\}/g,' ');
function speak(t,cb){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(plain(t)); u.lang='ko-KR'; u.rate=.9; if(cb) u.onend=cb; speechSynthesis.speak(u);}catch(e){ if(cb) cb(); } }

/* ---------- 그림: 두 직선과 한 직선 ---------- */
const COL={A:'#ff8fb0',B:'#7db7ff',C:'#8fe0b0',D:'#ffd66b'};
function fig(o){
  o=o||{}; if(o.kind==='tree') return figTree(o); if(o.kind==='eq') return figEq(o); const W=420,H=320, rad=d=>d*Math.PI/180;
  const t=o.t||60, a1=0, a2=(o.par===false)?(o.tilt||-13):0;
  const P1={x:240,y:95}, Q={x:195,y:225};
  // 아래 직선과 가로지르는 직선의 교점
  const dt={x:Math.cos(rad(t)),y:-Math.sin(rad(t))}, d2={x:Math.cos(rad(a2)),y:-Math.sin(rad(a2))};
  const det=dt.x*(-d2.y)-(-d2.x)*dt.y; const rx=Q.x-P1.x, ry=Q.y-P1.y;
  const s=(rx*(-d2.y)-(-d2.x)*ry)/det; const P2={x:P1.x+s*dt.x,y:P1.y+s*dt.y};
  const pt=(P,ang,r)=>({x:P.x+r*Math.cos(rad(ang)),y:P.y-r*Math.sin(rad(ang))});
  const seg=(P,ang,r1,r2,st)=>{const A=pt(P,ang,r1),B=pt(P,ang+180,r2);return `<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" ${st}/>`};
  let g='';
  if(o.rail){
    for(let x=40;x<=380;x+=34) g+=`<rect x="${x-5}" y="${P1.y-10}" width="10" height="${Q.y-P1.y+20}" fill="#b98a5a"/>`;
    g+=seg(P1,t,110,260,'stroke="#c9ced6" stroke-width="34" stroke-linecap="butt"');
  }
  const lineSt=o.rail?'stroke="#444" stroke-width="7" stroke-linecap="round"':'stroke="#1b1b1b" stroke-width="3.2" stroke-linecap="round"';
  const sect=(P,al,key)=>{ // 위치별 구역
    const R={UR:[al,t],UL:[t,al+180],LL:[al+180,t+180],LR:[t+180,al+360]}[key]; return R; };
  const names={1:[P1,a1,'UL'],2:[P1,a1,'UR'],3:[P1,a1,'LR'],4:[P1,a1,'LL'],5:[P2,a2,'UL'],6:[P2,a2,'UR'],7:[P2,a2,'LR'],8:[P2,a2,'LL']};
  const show=o.show==='none'?[]:(o.show||[1,2,3,4,5,6,7,8]);
  const hl=o.hl||{}, vals=o.vals||{};
  for(const k of Object.keys(names)){
    const [P,al,key]=names[k]; const [s0,s1]=sect(P,al,key); const A=pt(P,s0,30),B=pt(P,s1,30);
    if(hl[k]) g+=`<path d="M${P.x} ${P.y} L${A.x} ${A.y} A30 30 0 0 0 ${B.x} ${B.y} Z" fill="${COL[hl[k]]||hl[k]}" stroke="#1b1b1b" stroke-width="1.2"/>`;
    else if(vals[k]) g+=`<path d="M${A.x} ${A.y} A30 30 0 0 0 ${B.x} ${B.y}" fill="none" stroke="#1b1b1b" stroke-width="1.6"/>`;
  }
  g+=seg(P1,a1,150,215,lineSt)+seg(Q,a2,190,175,lineSt);
  if(!o.rail) g+=seg(P1,t,88,(P2.y-P1.y)/Math.sin(rad(t))+80,lineSt);
  if(o.marks&&o.par!==false){ for(const P of [pt(P1,0,115),pt(Q,0,150)]) g+=`<path d="M${P.x-7} ${P.y-7} l8 7 -8 7 M${P.x+1} ${P.y-7} l8 7 -8 7" fill="none" stroke="#e23d6d" stroke-width="2.4"/>`; }
  if(o.names!==false&&!o.rail){ const L=pt(P1,0,162),M=pt(Q,a2,202),N=pt(P1,t,100);
    g+=`<text x="${L.x}" y="${L.y+5}" font-style="italic">l</text><text x="${M.x}" y="${M.y+5}" font-style="italic">m</text><text x="${N.x+6}" y="${N.y+4}" font-style="italic">n</text>`; }
  for(const k of Object.keys(names)){
    if(!show.includes(+k)&&!vals[k]) continue;
    const [P,al,key]=names[k]; const [s0,s1]=sect(P,al,key); const mid=(s0+s1)/2; const wide=(s1-s0)>90;
    const txt=vals[k]||k; const C=pt(P,mid,vals[k]?(wide?50:62):(wide?17:21));
    const big=!!vals[k];
    g+=`<text x="${C.x}" y="${C.y+(big?6:5)}" text-anchor="middle" font-size="${big?21:16}" font-weight="800" fill="${vals[k]&&/x/.test(vals[k])?'#d81e5b':'#1b1b1b'}">${txt}</text>`;
  }
  return `<svg class="fig notranslate" translate="no" viewBox="0 0 ${W} ${H}" font-family="inherit" font-size="18" font-weight="700">${g}</svg>`;
}
function figTree(o){
  let x=o.x0||130, y=42, m=o.n; const dx=72, dy=68, nodes=[{x,y,t:m}], edges=[];
  while(true){ let q=2; while(m%q) q++; if(q===m) break;
    const A={x:x-dx,y:y+dy,t:q,prime:true}, B={x:x+dx,y:y+dy,t:m/q};
    edges.push([x,y,A.x,A.y],[x,y,B.x,B.y]); nodes.push(A,B); x=B.x; y=B.y; m=m/q; }
  if(nodes.length>1) nodes[nodes.length-1].prime=true;
  let g='';
  for(const e of edges) g+=`<line x1="${e[0]}" y1="${e[1]+16}" x2="${e[2]}" y2="${e[3]-22}" stroke="#1b1b1b" stroke-width="2.5"/>`;
  for(const d of nodes){ if(d.prime&&!o.plain) g+=`<circle cx="${d.x}" cy="${d.y}" r="21" fill="#ffd0de" stroke="#e23d6d" stroke-width="2.5"/>`;
    g+=`<text x="${d.x}" y="${d.y+9}" text-anchor="middle" font-size="26" font-weight="800">${d.t}</text>`; }
  if(o.eq) g+=`<text x="210" y="298" text-anchor="middle" font-size="25" font-weight="800">${o.eq}</text>`;
  return `<svg class="fig notranslate" translate="no" viewBox="0 0 420 320" font-family="inherit">${g}</svg>`;
}
function figEq(o){
  const L=o.lines, fs=o.size||(L.length>2?30:38), gap=fs*1.6, y0=160-gap*(L.length-1)/2;
  const row=(t,i)=>{ let h=''; String(t).split('**').forEach((q,k)=>{ h+= k%2 ? `<tspan fill="#d81e5b">${q}</tspan>` : q; });
    return `<text x="210" y="${y0+i*gap+fs*0.35}" text-anchor="middle" font-size="${fs}" font-weight="800">${h}</text>`; };
  return `<svg class="fig notranslate" translate="no" viewBox="0 0 420 320" font-family="inherit">${L.map(row).join('')}</svg>`;
}
function avatar(i){ const hair=['#3a2a1a','#111'][i], top=['#e9c46a','#b23a48'][i];
  return `<svg viewBox="0 0 80 96"><ellipse cx="40" cy="92" rx="30" ry="6" fill="#0002"/><path d="M14 96 q26 -44 52 0z" fill="${top}" stroke="#111" stroke-width="2"/><circle cx="40" cy="36" r="24" fill="#ffe0c2" stroke="#111" stroke-width="2"/><path d="M16 34 q4 -30 24 -26 q22 -4 24 26 q-12 -16 -48 0z" fill="${hair}"/><circle cx="32" cy="38" r="3"/><circle cx="48" cy="38" r="3"/><path d="M33 47 q7 6 14 0" fill="none" stroke="#111" stroke-width="2"/></svg>`; }

function frame(q,noBar){
  const st=$('#stage'); st.innerHTML=''; st.classList.remove('isvod');
  if(!noBar){ const bar=el('div','qbar'+(q?'':' hide'),'<span>'+rich(q||'')+'</span>'); st.append(bar);
    const tools=el('div','tools'); const sp=el('button','', '🔊'); sp.title='지시문 듣기'; sp.onclick=()=>speak(q); if(q) tools.append(sp); st.append(tools); }
  const pad=el('div','pad'+(q||noBar?'':' full')); if(!noBar) st.append(pad);
  return pad;
}
function chrome(sc){
  const st=$('#stage'), mod=LESSON.modules[mi];
  const p=el('button','nav prev','◀'), n=el('button','nav next','▶');
  p.disabled=(mi===0&&si===0); n.disabled=(mi===LESSON.modules.length-1&&si===mod.screens.length-1);
  p.onclick=()=>go(-1); n.onclick=()=>go(1); st.append(p,n);
  st.append(el('div','count notranslate',`${si+1}/${mod.screens.length}`));
  st.append(el('div','type',TYPE_KO[sc.type]||sc.type));
}
function feedback(pad){ const f=el('div','fb'); pad.append(f); return (ok,msg)=>{f.className='fb '+(ok?'ok':'no'); f.textContent=msg||(ok?'정답입니다! 잘했어요.':'다시 생각해 보세요.');}; }
function checkRow(pad,onCheck,onReset){ const r=el('div','btnrow'); const c=el('button','btn','확인'), z=el('button','btn sub','다시'); c.onclick=onCheck; z.onclick=onReset; r.append(c,z); pad.append(r); }
function withFig(pad,sc){ // 그림이 있으면 좌우로 나눔
  if(!sc.fig) return pad;
  const two=el('div','two'), l=el('div','l',fig(sc.fig)), r=el('div','r'); two.append(l,r); pad.append(two); pad.style.justifyContent='stretch'; return r;
}

R.vod=sc=>{
  const st=$('#stage'); st.innerHTML=''; let ci=0, timer=null;
  const box=el('div','vod'); st.append(box); st.classList.add('isvod');
  const draw=()=>{
    const c=sc.cuts[ci]; st.innerHTML=''; st.append(box); box.innerHTML='';
    box.append(el('div','tag notranslate','영상 대본 · 컷 '+(ci+1)+'/'+sc.cuts.length));
    if(c.title){ const t=el('div','title'); t.innerHTML=`<div class="t1 notranslate">어휘쑥쑥</div><div class="t2">수학편</div><div class="t3">${LESSON.grade}</div><div class="t4 notranslate">${LESSON.title}</div>`; box.append(t); }
    else{
      const scene=el('div','scene'); if(c.bg) box.style.background=c.bg;
      if(c.fig) scene.append(el('div','board',fig(c.fig))); else if(c.text) scene.append(el('div','board','<div style="font-size:1.5em;font-weight:900;text-align:center;line-height:1.6">'+rich(c.text)+'</div>'));
      (c.bubbles||[]).forEach((b,k)=>{ const w=el('div','who notranslate w'+b.who,avatar(b.who)+LESSON.cast[b.who]); scene.append(w);
        const bb=el('div','bub b'+b.who+((c.bubbles.filter(x=>x.who===b.who).indexOf(b)>0)?' low':''),rich(b.text)); scene.append(bb); });
      box.append(scene);
      box.append(el('div','capt'+(c.caption?'':' none'),rich(c.caption||'·')));
    }
    const ctrl=el('div','ctrl'); const pb=el('button','','◀ 컷'), nb=el('button','','컷 ▶'), au=el('button','',timer?'■ 멈춤':'▶ 이어 보기'), sp=el('button','','🔊');
    const bar=el('div','bar'); sc.cuts.forEach((_,k)=>bar.append(el('i',k<=ci?'on':'')));
    pb.onclick=()=>{stop(); if(ci>0){ci--;draw();}}; nb.onclick=()=>{stop(); if(ci<sc.cuts.length-1){ci++;draw();}};
    au.onclick=()=>{ if(timer){stop();draw();} else {timer=setInterval(()=>{ if(ci<sc.cuts.length-1){ci++;draw();} else {stop();draw();} },3500); draw();} };
    sp.onclick=()=>speak(c.narr||((c.bubbles||[]).map(b=>b.text).join(' ')+' '+(c.caption||'')));
    ctrl.append(pb,bar,nb,au,sp); box.append(ctrl); chrome(sc); showMemo(sc,c);
  };
  const stop=()=>{ if(timer){clearInterval(timer); timer=null;} };
  R._cleanup=stop; draw(); return true;
};

R.drag_drop=sc=>{ const pad=frame(sc.q||'보기에서 알맞은 낱말을 골라 빈칸에 넣어 보세요.'); const host=withFig(pad,sc);

R.linetoline=sc=>{ const pad=frame(sc.q||'알맞은 것끼리 연결해 보세요.'); const host=withFig(pad,sc); const lt=el('div','lt'); const L=el('div','col'), Rr=el('div','col'); const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); const map={}; let cur=null;

R.curation=sc=>{ const pad=frame(sc.q); const c=el('div','cur');
  sc.cols.forEach((col,i)=>{ if(i&&!sc.noArrow) c.append(el('div','arr','➜')); const d=el('div','col'+(col.hl?' hl':'')); d.append(el('div','lab',rich(col.label)));
    col.items.forEach(it=>{ const t=typeof it==='string'?{t:it}:it; d.append(el('div','it',rich(t.t)+(t.s?'<small>'+rich(t.s)+'</small>':''))); }); c.append(d); });
  pad.append(c); if(sc.note) pad.append(el('div','curnote',rich(sc.note))); };
R.checklist=sc=>{ const pad=frame(sc.q); const box=el('div','ck'); const sum=el('div','fb');
  const state=sc.items.map(()=>null);
  sc.items.forEach((it,i)=>{ const row=el('div','row'); const go=el('div','go');
    const y=el('button','btn sub','알아요'), n=el('button','btn sub','잘 몰라요');
    const upd=()=>{ y.style.background=state[i]===true?'#c9f2df':'#fff'; n.style.background=state[i]===false?'#fbd0d0':'#fff'; go.innerHTML=state[i]===false?rich(it.go||''):'';
      if(state.every(v=>v!==null)){ const k=state.filter(v=>v).length; sum.className='fb ok'; sum.textContent=k===state.length?'모두 아는 말이에요. 바로 시작해요!':'표시한 낱말의 차시를 먼저 봐도 좋아요.'; } };
    y.onclick=()=>{state[i]=true;upd();}; n.onclick=()=>{state[i]=false;upd();};
    const mid=el('div','ex'); mid.append(el('div','',rich(it.ex)),go);
    row.append(el('div','tm notranslate',it.t),mid,y,n); box.append(row); });
  pad.append(box,sum); };
R.lang_match=sc=>{ const pad=frame(sc.q); pad.append(el('div','lmw notranslate',sc.word));
  const g=el('div','lm notranslate'); sc.items.forEach(it=>g.append(el('div','','<small>'+it.lang+'</small>'+it.term))); pad.append(g);
  if(sc.note) pad.append(el('div','curnote',rich(sc.note))); };

function showMemo(sc,cut){
  const m=$('#memo'); let h=`<h3>제작 메모</h3><dl><dt>위치</dt><dd>${mi+1}. ${LESSON.modules[mi].name} · 화면 ${si+1}</dd><dt>원본 유형</dt><dd><code>${sc.type}</code> ${TYPE_KO[sc.type]||''}</dd>`;
  if(sc.q) h+=`<dt>지시문</dt><dd>${plain(sc.q)}</dd>`;
  if(sc.type==='vod'){ h+=`<dt>영상 제목</dt><dd>${sc.title||''}</dd>`; if(cut){ h+=`<dt>이 컷의 내레이션</dt><dd>${plain(cut.narr||'(대사만 있음)')}</dd>`; if(cut.dir) h+=`<dt>연출</dt><dd>${cut.dir}</dd>`; } }
  if(sc.answerText) h+=`<dt>정답</dt><dd>${sc.answerText}</dd>`;
  if(sc.memo) h+=`<dt>메모</dt><dd>${sc.memo}</dd>`;
  m.innerHTML=h+'</dl>';
}
function render(){
  if(R._cleanup){ R._cleanup(); R._cleanup=null; } try{speechSynthesis.cancel();}catch(e){}
  const mod=LESSON.modules[mi], sc=mod.screens[si];
  [...$('#toc').children].forEach((b,i)=>b.classList.toggle('on',i===mi));
  const self=(R[sc.type]||(()=>{frame('준비 중인 유형: '+sc.type);}))(sc);
  if(!self){ chrome(sc); showMemo(sc); }
  document.querySelectorAll('#stage .sent, #stage .chips, #stage .opts, #stage .ox, #stage .lt, #stage .say, #stage .card, #stage .motion, #stage .nav, #stage input, #stage .cur .it').forEach(e=>{e.classList.add('notranslate'); e.setAttribute('translate','no');});
  const st=$('#stage'); st.style.fontSize=(st.clientWidth/46)+'px';
  history.replaceState(null,'','#'+(mi+1)+'-'+(si+1));
}
function go(d){ const mod=LESSON.modules[mi]; if(d>0){ if(si<mod.screens.length-1) si++; else if(mi<LESSON.modules.length-1){mi++;si=0;} } else { if(si>0) si--; else if(mi>0){mi--;si=LESSON.modules[mi].screens.length-1;} } render(); }
function init(){
  $('#lessonCode').textContent=LESSON.code||''; $('#lessonTitle').textContent=LESSON.title; $('#topTitle').textContent=LESSON.title; $('#lessonMeta').textContent=LESSON.grade+' · '+LESSON.standard;
  LESSON.modules.forEach((m,i)=>{ const b=el('button','',`<span>${m.name}</span><small class="notranslate">${m.screens.length}</small>`); b.onclick=()=>{mi=i;si=0;render();}; $('#toc').append(b); });
  $('#prevMod').onclick=()=>{ if(mi>0){mi--;si=0;render();} }; $('#nextMod').onclick=()=>{ if(mi<LESSON.modules.length-1){mi++;si=0;render();} };
  $('#memoBtn').onclick=()=>{ memoOn=!memoOn; $('#memo').classList.toggle('on',memoOn); $('#memoBtn').classList.toggle('on',memoOn); render(); };
  const h=location.hash.match(/#(\d+)-(\d+)(m?)/); if(h){ mi=Math.min(LESSON.modules.length-1,h[1]-1); si=Math.min(LESSON.modules[mi].screens.length-1,h[2]-1); if(h[3]){memoOn=true;$('#memo').classList.add('on');$('#memoBtn').classList.add('on');} }
  window.addEventListener('resize',()=>{const st=$('#stage'); st.style.fontSize=(st.clientWidth/46)+'px';});
  document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT') return; if(e.key==='ArrowRight') go(1); if(e.key==='ArrowLeft') go(-1); });
  render();
}
window.onerror=(m,s,l)=>{ document.title='ERR '+m+' @'+l; };
init();
