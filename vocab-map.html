<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>60차시 학습 어휘 지도</title>
<style>
:root{--ink:#1d2433;--line:#1b1b1b;--new:#0a5c4b;--newbg:#e3f8f1;--newbd:#19b394;--pre:#1e4fb3;--post:#c2410c;--pw:340px}
*{box-sizing:border-box}
html,body{height:100%}
body{font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;background:#eef5fb;color:var(--ink);margin:0;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:9px 14px;background:#fff;border-bottom:2px solid var(--line)}
header h1{font-size:17px;margin:0 6px 0 0}
header a.home{text-decoration:none;font-weight:800;color:var(--ink);border:1.5px solid var(--line);border-radius:99px;padding:3px 11px;font-size:13px;background:#fff}
.tabs{display:flex;border:1.5px solid var(--line);border-radius:99px;overflow:hidden}
.tabs button{border:0;background:#fff;padding:5px 14px;font:inherit;font-weight:800;font-size:13.5px;cursor:pointer;color:var(--ink)}
.tabs button.on{background:#2a1a00;color:#fff}
#q{border:1.5px solid var(--line);border-radius:99px;padding:5px 13px;font:inherit;font-size:13.5px;width:190px}
.zoom button,#clear{border:1.5px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-weight:800;font-size:13px;padding:3px 9px;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:#4b5563;margin-left:auto;align-items:center}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:3px;vertical-align:-1px}
.wrap{flex:1;display:flex;min-height:0}
main{flex:1;min-width:0;position:relative;overflow:hidden}
#mm{width:100%;height:100%;display:block;cursor:grab;touch-action:none;background:#f7fbff}
#mm.drag{cursor:grabbing}
#flow{position:absolute;inset:0;overflow:auto;display:none;background:#f7fbff}
#mm{display:none}body.v-mm #mm{display:block}.zoom{display:none}body.v-mm .zoom{display:inline}body.v-flow #flow{display:block}
.pg{position:absolute;inset:0;overflow:auto;display:none;background:#f7fbff;padding-bottom:70px}
body.v-std #std,body.v-sec #sec{display:block}
.pg .meta{color:#6b7280;font-size:12px;font-weight:600}
.jump{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1.5px solid #cbd5e1;padding:7px 12px;display:flex;flex-wrap:wrap;gap:5px}
.jump button{border:0;color:#fff;border-radius:99px;font:inherit;font-size:12px;font-weight:800;padding:3px 10px;cursor:pointer}
.gh{margin:16px 12px 4px;padding:6px 13px;border-radius:8px;color:#fff;font-weight:800;font-size:15px;display:flex;justify-content:space-between;align-items:center;scroll-margin-top:92px}
.gh small{font-weight:600;opacity:.92;font-size:12.5px}
.tr{display:flex;gap:12px;margin:0 12px;padding:9px 0;border-bottom:1px solid #dbe4ef}
.th{flex:0 0 270px;font-size:13px;line-height:1.5}.th b{font-size:14.5px}.th .tx{color:#4b5563;font-size:12.5px}
.td{flex:1;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;min-width:0}
.lc{background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:6px 9px;cursor:pointer;max-width:340px}
.lc .no{display:inline-block;min-width:26px;text-align:center;background:#2f6fe4;color:#fff;border-radius:7px;font-weight:800;font-size:12.5px;padding:0 5px}
.lc b{font-size:13.5px}.lc .chips{margin-top:4px}.lc .c{font-size:12px;padding:1px 8px}.lc .sp{font-size:11px;color:#b45309;font-weight:700}
.none{color:#b45309;font-weight:700;font-size:12.5px;padding-top:3px}
body.has-sel .lc{opacity:.3}
body.has-sel .lc.s-self{opacity:1;background:#fffbe8;outline:4px solid #f6b21a}
body.has-sel .lc.s-pre{opacity:1;background:#eef4ff;outline:3px solid var(--pre)}
body.has-sel .lc.s-post{opacity:1;background:#fff3ea;outline:3px solid var(--post)}
aside{flex:0 0 var(--pw);background:#fff;border-left:2px solid var(--line);overflow:auto;padding:14px 15px 40px;font-size:13.5px;line-height:1.6}
aside h2{font-size:18px;margin:0 0 2px}aside h3{font-size:12.5px;margin:13px 0 4px;color:#6b7280}
aside .meta{color:#6b7280;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.c{border-radius:99px;padding:2px 9px;font-weight:800;font-size:13px;cursor:pointer;border:1.5px solid var(--newbd);background:var(--newbg);color:var(--new);white-space:nowrap}
.c.x{border:1.5px dashed #c9a24a;background:#fff8e1;color:#6b4b00;font-weight:700}
.c.r{border:1.5px solid #2f6fe4;background:#eef4ff;color:var(--pre);font-weight:700}
.c.e{border:1.5px solid #c3c9d4;background:#f4f6f9;color:#4b5563;font-weight:700}
.c small{opacity:.7;font-weight:600}
aside ul{margin:0;padding:0;list-style:none}aside li{padding:3px 0;border-bottom:1px dashed #e2e8f0}
.lk{color:var(--pre);font-weight:800;cursor:pointer;text-decoration:underline}
.btn{display:inline-block;margin:8px 6px 0 0;border-radius:99px;padding:3px 12px;font-size:12.5px;font-weight:800;text-decoration:none;background:#19b394;color:#fff}
.btn.g{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.tip{background:#fffbe8;border:1.5px solid #f6b21a;border-radius:10px;padding:8px 11px;font-size:12.5px;margin-bottom:10px}
/* 마인드맵 */
#mm text{font-size:11.5px;fill:var(--ink);cursor:pointer;user-select:none}
#mm .tl{fill:none;stroke-width:1.2;opacity:.42}
#mm .u text{font-size:13px;font-weight:800}
#mm .l text{font-weight:700}
#mm .w.new text{fill:var(--new);font-weight:800}
#mm .w.aux text{fill:#8a5a00}
#mm .root text{font-size:15px;font-weight:800;text-anchor:middle;cursor:default}
#mm .ov{fill:none;stroke-width:2.6;opacity:.9}
#mm .ov.pre{stroke:var(--pre)}#mm .ov.post{stroke:var(--post)}
body.has-sel #mm .l,body.has-sel #mm .w,body.has-sel #mm .u,body.has-sel #mm .tl{opacity:.13}
body.has-sel #mm .s-self,body.has-sel #mm .s-pre,body.has-sel #mm .s-post{opacity:1}
#mm .l.s-self circle{stroke:#f6b21a;stroke-width:5}
#mm .s-pre text{fill:var(--pre)!important;font-weight:800}
#mm .s-post text{fill:var(--post)!important;font-weight:800}
#mm .w.s-self text{font-size:13px}
/* 위계 흐름 */
#flowin{position:relative;min-width:980px}
#arcs{position:absolute;left:0;top:0;pointer-events:none}
#arcs path{fill:none;stroke:#9aa7ba;stroke-width:1;opacity:.5}
#arcs path.pre{stroke:var(--pre);stroke-width:2.6;opacity:1}#arcs path.post{stroke:var(--post);stroke-width:2.6;opacity:1}
body.has-sel #arcs path:not(.pre):not(.post){opacity:.08}
.uh{height:32px;display:flex;align-items:center;font-weight:800;font-size:13.5px;color:#fff;padding:0 12px;border-radius:8px 0 0 8px}
.row{height:38px;display:flex;align-items:center;gap:7px;padding:0 10px;border-bottom:1px solid #e3eaf3;cursor:pointer;white-space:nowrap;background:#fff}
.row .no{flex:0 0 30px;text-align:center;background:#2f6fe4;color:#fff;border-radius:7px;font-weight:800;font-size:12.5px;padding:1px 0}
.row .nm{flex:0 0 200px;font-weight:800;font-size:13.5px;overflow:hidden;text-overflow:ellipsis}
.row .sb{flex:0 0 250px;font-size:11.5px;color:#6b7280;overflow:hidden;text-overflow:ellipsis}
.row .c{font-size:12px;padding:1px 8px}
body.has-sel .row{opacity:.28}
body.has-sel .row.s-self{opacity:1;background:#fffbe8;box-shadow:inset 5px 0 0 #f6b21a}
body.has-sel .row.s-pre{opacity:1;background:#eef4ff;box-shadow:inset 5px 0 0 var(--pre)}
body.has-sel .row.s-post{opacity:1;background:#fff3ea;box-shadow:inset 5px 0 0 var(--post)}
.c.s-w{outline:3px solid #f6b21a}
@media(max-width:820px){.tr{flex-direction:column;gap:5px}.th{flex:none}.wrap{flex-direction:column}aside{flex:0 0 38vh;border-left:0;border-top:2px solid var(--line)}.legend{display:none}#q{width:130px}}
</style></head>

<a class="home" href="./">🏠 목차</a><h1>60차시 학습 어휘 지도</h1>

  const n=el('g',Object.assign({class:cls,transform:`rotate(${deg}) translate(${r},0)`},attrs||{}),g);
  el('circle',{r:rad,fill:col,stroke:'#fff','stroke-width':1.5},n);
  el('text',flip?{transform:'rotate(180)',x:-(rad+4),'text-anchor':'end',dy:'.34em'}:{x:rad+4,dy:'.34em'},n,label);return n}
const gL=el('g',{},mm),gN=el('g',{},mm),gO=el('g',{},mm);
U.forEach(u=>{link(u.a,0,u.a,R1,u.col,gL).dataset.u=u.k;
  node(u.a,R1,'u',u.k,u.col,gN,7);
  u.ls.forEach(d=>{link(u.a,R1,d.a,R2,u.col,gL);
    node(d.a,R2,'l',d.no+' '+d.name,u.col,gN,5.5,{'data-l':d.no});
    d.leaves.forEach((lf,i)=>{link(d.a,R2,d.la[i],R3,u.col,gL);
      node(d.la[i],R3,'w '+lf[1],lf[0]+(ESS.has(lf[0])?'★':''),lf[1]==='new'?'#19b394':'#c9a24a',gN,3.2,{'data-w':lf[0],'data-pl':d.no})})})});
const rt=el('g',{class:'root'},gN);el('circle',{r:46,fill:'#2a1a00'},rt);el('text',{dy:'-.2em',style:'fill:#fff'},rt,'수학 한국어');el('text',{dy:'1em',style:'fill:#fff'},rt,'어휘 60차시');
const VB0=[-740,-740,1480,1480];let vb=VB0.slice();const setVB=()=>mm.setAttribute('viewBox',vb.join(' '));
function zoom(f,cx,cy){if(!f){vb=VB0.slice();return setVB()}const w=vb[2]/f,h=vb[3]/f;if(w<200||w>4000)return;cx=cx==null?vb[0]+vb[2]/2:cx;cy=cy==null?vb[1]+vb[3]/2:cy;vb=[cx-(cx-vb[0])/f,cy-(cy-vb[1])/f,w,h];setVB()}
function svgPt(e){const r=mm.getBoundingClientRect(),s=Math.max(vb[2]/r.width,vb[3]/r.height);return[vb[0]+vb[2]/2+(e.clientX-r.left-r.width/2)*s,vb[1]+vb[3]/2+(e.clientY-r.top-r.height/2)*s,s]}
mm.addEventListener('wheel',e=>{e.preventDefault();const p=svgPt(e);zoom(e.deltaY<0?1.15:1/1.15,p[0],p[1])},{passive:false});
let drag=null,moved=false;
mm.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:vb[0],vy:vb[1],s:svgPt(e)[2]};moved=false});
window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5){moved=true;mm.classList.add('drag')}if(moved){vb[0]=drag.vx-dx*drag.s;vb[1]=drag.vy-dy*drag.s;setVB()}});
window.addEventListener('pointerup',()=>{drag=null;mm.classList.remove('drag')});
document.querySelectorAll('.zoom button').forEach(b=>b.onclick=()=>zoom(+b.dataset.z));

/* ───── 위계 흐름 ───── */
const rows=document.getElementById('rows'),arcs=document.getElementById('arcs'),AW=innerWidth<820?120:300;
rows.style.marginLeft=AW+'px';let y=0;const Y={};let html='';
U.forEach(u=>{html+=`<div class="uh" style="background:${u.col}">${esc(u.k)}</div>`;y+=32;
  u.ls.forEach(d=>{Y[d.no]=y+19;y+=38;
    html+=`<div class="row" data-l="${d.no}"><span class="no">${d.no}</span><span class="nm">${esc(d.name)}</span><span class="sb">${esc(d.sub)}</span>`+
      d.new.map(w=>`<span class="c" data-w="${esc(w)}">${star(w)}</span>`).join('')+d.aux.map(w=>`<span class="c x" data-w="${esc(w)}">${esc(w)}</span>`).join('')+'</div>'})});
rows.innerHTML=html;arcs.setAttribute('width',AW);arcs.setAttribute('height',y);
const E=[];L.forEach(d=>pre[d.no].forEach(a=>{const dx=Math.min(AW-14,16+(d.no-a)*(AW-30)/40);E.push({a,b:d.no,p:el('path',{d:`M${AW},${Y[a]}C${AW-dx},${Y[a]} ${AW-dx},${Y[d.no]} ${AW},${Y[d.no]}`},arcs)})}));

/* ───── 선택 ───── */
let sel=null;const panel=document.getElementById('panel');
const lref=n=>`<span class="lk" data-l="${n}">${n}차시 ${esc(byNo[n].name)}</span>`;
function chips(ws,cls){return '<div class="chips">'+ws.map(w=>`<span class="c ${cls}" data-w="${esc(w)}">${star(w)}</span>`).join('')+'</div>'}
function intro(){panel.innerHTML=`<div class="tip"><b>보는 법</b><br>차시나 낱말을 누르면, 그것을 익히기 전에 <b style="color:var(--pre)">먼저 알아야 하는 차시·낱말</b>과 <b style="color:var(--post)">그 낱말을 다시 쓰는 뒤 차시</b>가 표시됩니다.<br>마인드맵은 끌어서 옮기고 휠로 확대합니다.</div>
<h3>구성</h3>전체 ${L.length}차시 · 새 어휘 ${L.reduce((s,d)=>s+d.new.length,0)}개 · 함께 보는 말 ${L.reduce((s,d)=>s+d.aux.length,0)}개
<h3>단원</h3><ul>${U.map(u=>`<li><b style="color:${u.col}">●</b> ${esc(u.k)} <span class="meta">${u.ls[0].no}~${u.ls[u.ls.length-1].no}차시</span></li>`).join('')}</ul>
<h3>어휘의 세 가지</h3><ul><li><span class="c">새 어휘</span> 그 소단원에서 처음 나오는 말. 이 차시에서 익힘</li><li><span class="c r">앞에서 배운 말</span> 뜻만 확인. 모르면 그 낱말을 익히는 차시로</li><li><span class="c e">초등에서 배운 말</span> 차시 안에서 배경지식으로 안내</li></ul>`}
function showLesson(n){const d=byNo[n],pr=d.review.filter(r=>typeof r[1]==='number'),el_=d.review.filter(r=>typeof r[1]!=='number'),ps=[...(post[n]||[])].sort((a,b)=>a-b),an=[...anc(n)].sort((a,b)=>a-b);
  const b=BUILT[d.name];
  panel.innerHTML=`<div class="meta">${esc(ukey(d))} · ${esc(d.type)}</div><h2>${d.no}차시 ${esc(d.name)}</h2>
<div class="meta">먼저 보고 배우는 소단원: <b>${esc(d.sub)}</b> ${esc(d.std)}</div>
<a class="btn g" href="./#L${d.no}">목차 카드</a>${b?`<a class="btn" href="${b}/">시안 열기 ▶</a>`:''}
<h3>새 어휘 — 이 차시에서 익힘</h3>${chips(d.new,'')}${Object.keys(d.elemNew||{}).length?`<div class="meta">${Object.keys(d.elemNew).map(w=>esc(w)+'('+esc(d.elemNew[w])+')').join(', ')}: 초등에서 배운 말을 다시 익힘</div>`:''}
${d.aux.length?'<h3>함께 처음 보는 말</h3>'+chips(d.aux,'x'):''}
${pr.length?'<h3>앞에서 배운 말 — 모르면 이 차시를 먼저</h3><ul>'+pr.map(r=>`<li><span class="c r" data-w="${esc(r[0])}">${star(r[0])}</span> ← ${lref(r[1])}</li>`).join('')+'</ul>':''}
${el_.length?'<h3>초등에서 배운 말 — 이 차시 안에서 안내</h3><div class="chips">'+el_.map(r=>`<span class="c e" data-w="${esc(r[0])}">${esc(r[0])} <small>${esc(r[1])}</small></span>`).join('')+'</div>':''}
${ps.length?'<h3>이 차시의 낱말을 다시 쓰는 차시</h3><ul>'+ps.map(m=>`<li>${lref(m)} <span class="meta">${byNo[m].review.filter(r=>r[1]===n).map(r=>esc(r[0])).join(', ')}</span></li>`).join('')+'</ul>':''}
${an.length?'<h3>거슬러 올라간 선행 차시 전체</h3><ul>'+an.map(m=>`<li>${lref(m)}</li>`).join('')+'</ul>':'<h3>선행 차시</h3>없음 (초등에서 배운 말과 배경지식에서 시작)'}`}
function showWord(w){const h=home[w],us=uses[w]||[];
  panel.innerHTML=`<div class="meta">낱말</div><h2>${star(w)}</h2>${ESS.has(w)?'<div class="meta">충남대 핵심어</div>':''}
<h3>익히는 곳</h3>${h?lref(h)+` <span class="meta">${byNo[h].new.includes(w)?'새 어휘':'함께 보는 말'} · ${esc(byNo[h].sub)}</span>`:(elem[w]?`초등학교 ${esc(elem[w])}에서 배운 말 <div class="meta">앞 차시로 보내지 않고, 쓰이는 차시 안에서 배경지식으로 안내합니다.</div>`:'-')}
<h3>${h?'앞에서 배운 말로 다시 쓰이는 차시':'쓰이는 차시'}</h3>${us.length?'<ul>'+us.map(m=>`<li>${lref(m)}</li>`).join('')+'</ul>':'없음'}`}
function apply(scroll){
  document.querySelectorAll('.s-self,.s-pre,.s-post,.s-w').forEach(e=>e.classList.remove('s-self','s-pre','s-post','s-w'));
  E.forEach(e=>e.p.setAttribute('class',''));gO.innerHTML='';document.body.classList.toggle('has-sel',!!sel);
  if(!sel)return intro();
  const role={},wr={},hot=[];
  if(sel.l){const n=sel.l,an=anc(n);an.forEach(a=>role[a]='pre');(post[n]||[]).forEach(m=>role[m]='post');role[n]='self';
    byNo[n].review.forEach(r=>{if(typeof r[1]==='number')wr[r[0]]='pre'});byNo[n].leaves.forEach(lf=>wr[lf[0]]='self');
    E.forEach(e=>{if((e.b===n||an.has(e.b))&&(an.has(e.a)))hot.push([e,'pre']);else if(e.a===n)hot.push([e,'post'])});showLesson(n)}
  else{const w=sel.w,h=home[w];wr[w]='self';if(h)role[h]='self';(uses[w]||[]).forEach(m=>role[m]='post');
    if(h)E.forEach(e=>{if(e.a===h&&(uses[w]||[]).includes(e.b))hot.push([e,'post'])});showWord(w)}
  document.querySelectorAll('[data-l]').forEach(e=>{if(e.closest('aside'))return;const r=role[e.dataset.l];if(r)e.classList.add('s-'+r)});
  document.querySelectorAll('#mm [data-w]').forEach(e=>{const r=wr[e.dataset.w];if(r&&(r!=='pre'||home[e.dataset.w]==e.dataset.pl))e.classList.add('s-'+r)});
  if(sel.w)document.querySelectorAll('.row [data-w]').forEach(e=>{if(e.dataset.w===sel.w)e.classList.add('s-w')});
  hot.forEach(([e,c])=>{e.p.setAttribute('class',c);const a=byNo[e.a],b=byNo[e.b],p1=P(a.a,R2),p2=P(b.a,R2);el('path',{class:'ov '+c,d:`M${p1}Q0,0 ${p2}`},gO)});
  if(scroll&&curV!=='mm'){const n=sel.l||home[sel.w],box=curV==='flow'?rows:document.getElementById(curV),r=n&&box.querySelector(`[data-l="${n}"]`);if(r)r.scrollIntoView({block:'center'})}
}
document.addEventListener('click',e=>{if(moved){moved=false;return}const j=e.target.closest('[data-j]');if(j){document.getElementById(j.dataset.j).scrollIntoView({behavior:'smooth'});return}const t=e.target.closest('[data-w],[data-l]');if(!t)return;
  sel=t.dataset.w!=null?{w:t.dataset.w}:{l:+t.dataset.l};apply(!!t.closest('aside'))});
document.getElementById('clear').onclick=()=>{sel=null;apply()};
const VIEWS=['mm','flow','std','sec'];let curV='mm';
function view(v){curV=v;VIEWS.forEach(x=>{document.body.classList.toggle('v-'+x,x===v);document.getElementById('t-'+x).classList.toggle('on',x===v)});try{history.replaceState(null,'','#'+v)}catch(e){}if(sel)apply(true)}
VIEWS.forEach(x=>document.getElementById('t-'+x).onclick=()=>view(x));
/* ───── 성취기준별 · 교과서 소단원별 ───── */
const ucol={};U.forEach(u=>ucol[u.k]=u.col);
function lcard(d,note){return `<div class="lc" data-l="${d.no}"><span class="no">${d.no}</span> <b>${esc(d.name)}</b>${note?` <span class="sp">${note}</span>`:''}<div class="chips">`+d.new.map(w=>`<span class="c" data-w="${esc(w)}">${star(w)}</span>`).join('')+d.aux.map(w=>`<span class="c x" data-w="${esc(w)}">${esc(w)}</span>`).join('')+'</div></div>'}
function table(id,groups,unitName,lead){let h='<div class="jump">'+groups.map((g,i)=>`<button style="background:${g.col}" data-j="${id}-g${i}">${esc(g.k)}</button>`).join('')+'</div><div class="tr" style="border:0;padding-bottom:0"><span class="meta">'+lead+'</span></div>';
  groups.forEach((g,i)=>{const ls=new Set();g.rows.forEach(r=>r.ls.forEach(x=>ls.add(x[0].no)));
    h+=`<div class="gh" id="${id}-g${i}" style="background:${g.col}"><span>${esc(g.k)}</span><small>${g.common?'':unitName+' '+g.rows.length+'개 · '}차시 ${ls.size}개</small></div>`;
    g.rows.forEach(r=>{h+=`<div class="tr"><div class="th"><b>${esc(r.head)}</b>${r.tag?` <span class="meta">${esc(r.tag)}</span>`:''}<div class="tx">${esc(r.text||'')}</div></div><div class="td">${r.ls.length?r.ls.map(x=>lcard(x[0],x[1])).join(''):'<span class="none">차시 없음</span>'}</div></div>`})});
  document.getElementById(id).innerHTML=h}
const common={k:U[0].k,col:U[0].col,common:true,rows:[{head:'모든 단원',text:'문제의 지시문을 이해하는 데 쓰는 말. 특정 단원에 속하지 않고 가장 먼저 봅니다.',ls:L.filter(d=>d.grade==='공통').map(d=>[d,''])}]};
table('std',[common].concat(D.toc.map(t=>({k:t.grade+' '+t.unit,col:ucol[t.grade+' '+t.unit],rows:D.stds.filter(x=>x.grade===t.grade&&x.unit===t.unit).map(x=>({head:x.code,tag:x.topic,text:x.text,ls:L.filter(d=>d.stds.includes(x.code)).map(d=>[d,d.stds.length>1?'성취기준 '+d.stds.length+'개에 걸침':''])}))}))),'성취기준','2022 개정 교육과정 중학교 수학 성취기준 가운데 중1·중2에 해당하는 '+D.stds.length+'개를 학년별 단원 순으로 늘어놓았습니다. 한 차시가 여러 성취기준에 걸치면 각 성취기준에 모두 나옵니다.');
table('sec',[common].concat(D.toc.map(t=>({k:t.grade+' '+t.unit,col:ucol[t.grade+' '+t.unit],rows:t.secs.map(x=>({head:x.n+'. '+x.title,tag:x.page+'쪽',text:'',ls:L.filter(d=>d.grade===t.grade&&d.unit===t.unit&&d.secs.includes(x.n)).map(d=>[d,d.secs.length>1?'소단원 '+d.secs[0]+'~'+d.secs[d.secs.length-1]+'에 걸침':''])}))}))),'소단원','천재교육(김화경) 중학교 수학 1·2 교과서의 소단원 차례입니다. 각 소단원을 배우기 전에 보는 차시를 옆에 놓았습니다. 한 차시가 여러 소단원에 걸치면 각 소단원에 모두 나옵니다.');
const allW=[...new Set(Object.keys(home).concat(Object.keys(elem)))].sort((a,b)=>a.localeCompare(b,'ko'));
document.getElementById('q').addEventListener('input',e=>{const q=e.target.value.trim();if(!q){apply();return}
  const hit=allW.filter(w=>w.includes(q)),ls=L.filter(d=>d.name.includes(q)||d.sub.includes(q));
  panel.innerHTML=`<h2>‘${esc(q)}’ 찾기</h2><h3>낱말 ${hit.length}개</h3><ul>${hit.slice(0,60).map(w=>`<li><span class="c ${home[w]?(byNo[home[w]].new.includes(w)?'':'x'):'e'}" data-w="${esc(w)}">${star(w)}</span> <span class="meta">${home[w]?home[w]+'차시 '+esc(byNo[home[w]].name):'초등 '+esc(elem[w])}</span></li>`).join('')}</ul>${ls.length?'<h3>차시</h3><ul>'+ls.map(d=>`<li>${lref(d.no)}</li>`).join('')+'</ul>':''}`});
const H0=location.hash,m=H0.match(/^#([FST]?)L(\d+)$/),V0={'':'mm',F:'flow',S:'std',T:'sec'};
view(m?V0[m[1]]:(VIEWS.includes(H0.slice(1))?H0.slice(1):'mm'));intro();
if(m&&byNo[+m[2]]){sel={l:+m[2]};apply(true)}
</script>
</body></html>
