<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>60차시 학습 어휘 지도</title>
<style>
:root{--ink:#1d2433;--line:#1b1b1b;--new:#0a5c4b;--newbg:#e3f8f1;--newbd:#19b394;--pre:#1e4fb3;--post:#c2410c;--pw:340px}
*{box-sizing:border-box}
html,body{height:100%}
body{font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;background:#eef5fb;color:var(--ink);margin:0;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:9px 14px;background:#fff;border-bottom:2px solid var(--line)}
header h1{font-size:17px;margin:0 6px 0 0}
header a.home{text-decoration:none;font-weight:800;color:var(--ink);border:1.5px solid var(--line);border-radius:99px;padding:3px 11px;font-size:13px;background:#fff}
.tabs{display:flex;border:1.5px solid var(--line);border-radius:99px;overflow:hidden}
.tabs button{border:0;background:#fff;padding:5px 14px;font:inherit;font-weight:800;font-size:13.5px;cursor:pointer;color:var(--ink)}
.tabs button.on{background:#2a1a00;color:#fff}
#q{border:1.5px solid var(--line);border-radius:99px;padding:5px 13px;font:inherit;font-size:13.5px;width:190px}
.zoom button,#clear,#fm{border:1.5px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-weight:800;font-size:13px;padding:3px 9px;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:#4b5563;margin-left:auto;align-items:center}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:3px;vertical-align:-1px}
.wrap{flex:1;display:flex;min-height:0}
main{flex:1;min-width:0;position:relative;overflow:hidden}
#mm{width:100%;height:100%;display:block;cursor:grab;touch-action:none;background:#f7fbff}
#mm.drag{cursor:grabbing}
#flow{position:absolute;inset:0;overflow:auto;display:none;background:#f7fbff}
#mm{display:none}body.v-mm #mm{display:block}.zoom{display:none}body.v-mm .zoom{display:inline}body.v-flow #flow{display:block}
.pg{position:absolute;inset:0;overflow:auto;display:none;background:#f7fbff;padding-bottom:70px}
body.v-std #std,body.v-sec #sec{display:block}
.pg .meta{color:#6b7280;font-size:12px;font-weight:600}
.jump{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1.5px solid #cbd5e1;padding:7px 12px;display:flex;flex-wrap:wrap;gap:5px}
.jump button{border:0;color:#fff;border-radius:99px;font:inherit;font-size:12px;font-weight:800;padding:3px 10px;cursor:pointer}
.gh{margin:16px 12px 4px;padding:6px 13px;border-radius:8px;color:#fff;font-weight:800;font-size:15px;display:flex;justify-content:space-between;align-items:center;scroll-margin-top:92px}
.gh small{font-weight:600;opacity:.92;font-size:12.5px}
.tr{display:flex;gap:12px;margin:0 12px;padding:9px 0;border-bottom:1px solid #dbe4ef}
.th{flex:0 0 270px;font-size:13px;line-height:1.5}.th b{font-size:14.5px}.th .tx{color:#4b5563;font-size:12.5px}
.td{flex:1;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;min-width:0}
.lc{background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:6px 9px;cursor:pointer;max-width:340px}
.lc .no{display:inline-block;min-width:26px;text-align:center;background:#2f6fe4;color:#fff;border-radius:7px;font-weight:800;font-size:12.5px;padding:0 5px}
.lc b{font-size:13.5px}.lc .chips{margin-top:4px}.lc .c{font-size:12px;padding:1px 8px}.lc .sp{font-size:11px;color:#b45309;font-weight:700}
.none{color:#b45309;font-weight:700;font-size:12.5px;padding-top:3px}
body.has-sel .lc{opacity:.3}
body.has-sel .lc.s-self{opacity:1;background:#fffbe8;outline:4px solid #f6b21a}
body.has-sel .lc.s-pre{opacity:1;background:#eef4ff;outline:3px solid var(--pre)}
body.has-sel .lc.s-post{opacity:1;background:#fff3ea;outline:3px solid var(--post)}
aside{flex:0 0 var(--pw);background:#fff;border-left:2px solid var(--line);overflow:auto;padding:14px 15px 40px;font-size:13.5px;line-height:1.6}
aside h2{font-size:18px;margin:0 0 2px}aside h3{font-size:12.5px;margin:13px 0 4px;color:#6b7280}
aside .meta{color:#6b7280;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.c{border-radius:99px;padding:2px 9px;font-weight:800;font-size:13px;cursor:pointer;border:1.5px solid var(--newbd);background:var(--newbg);color:var(--new);white-space:nowrap}
.c.x{border:1.5px dashed #c9a24a;background:#fff8e1;color:#6b4b00;font-weight:700}
.c.r{border:1.5px solid #2f6fe4;background:#eef4ff;color:var(--pre);font-weight:700}
.c.e{border:1.5px solid #c3c9d4;background:#f4f6f9;color:#4b5563;font-weight:700}
.c small{opacity:.7;font-weight:600}
aside ul{margin:0;padding:0;list-style:none}aside li{padding:3px 0;border-bottom:1px dashed #e2e8f0}
.lk{color:var(--pre);font-weight:800;cursor:pointer;text-decoration:underline}
.btn{display:inline-block;margin:8px 6px 0 0;border-radius:99px;padding:3px 12px;font-size:12.5px;font-weight:800;text-decoration:none;background:#19b394;color:#fff}
.btn.g{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.tip{background:#fffbe8;border:1.5px solid #f6b21a;border-radius:10px;padding:8px 11px;font-size:12.5px;margin-bottom:10px}
/* 마인드맵 */
#mm text{font-size:11.5px;fill:var(--ink);cursor:pointer;user-select:none}
#mm .tl{fill:none;stroke-width:1.2;opacity:.42}
#mm .u text{font-size:13px;font-weight:800}
#mm .l text{font-weight:700}
#mm .w.new text{fill:var(--new);font-weight:800}
#mm .w.aux text{fill:#8a5a00}
#mm .root text{font-size:15px;font-weight:800;text-anchor:middle;cursor:default}
#mm .ov{fill:none;stroke-width:2.6;opacity:.9}
#mm .ov.pre{stroke:var(--pre)}#mm .ov.post{stroke:var(--post)}
body.has-sel #mm .l,body.has-sel #mm .w,body.has-sel #mm .u,body.has-sel #mm .tl{opacity:.13}
body.has-sel #mm .s-self,body.has-sel #mm .s-pre,body.has-sel #mm .s-post{opacity:1}
#mm .l.s-self circle{stroke:#f6b21a;stroke-width:5}
#mm .s-pre text{fill:var(--pre)!important;font-weight:800}
#mm .s-post text{fill:var(--post)!important;font-weight:800}
#mm .w.s-self text{font-size:13px}
/* 위계 흐름 */
#flowin{position:relative;min-width:980px}
#arcs{position:absolute;left:0;top:0;pointer-events:none}
#arcs path{fill:none;stroke:#9aa7ba;stroke-width:1;opacity:.5}
#arcs path.pre{stroke:var(--pre);stroke-width:2.6;opacity:1}#arcs path.post{stroke:var(--post);stroke-width:2.6;opacity:1}
body.has-sel #arcs path:not(.pre):not(.post){opacity:.08}
.uh{height:32px;display:flex;align-items:center;font-weight:800;font-size:13.5px;color:#fff;padding:0 12px;border-radius:8px 0 0 8px}
.row{height:38px;display:flex;align-items:center;gap:7px;padding:0 10px;border-bottom:1px solid #e3eaf3;cursor:pointer;white-space:nowrap;background:#fff}
.row .no{flex:0 0 30px;text-align:center;background:#2f6fe4;color:#fff;border-radius:7px;font-weight:800;font-size:12.5px;padding:1px 0}
.row .nm{flex:0 0 200px;font-weight:800;font-size:13.5px;overflow:hidden;text-overflow:ellipsis}
.row .sb{flex:0 0 250px;font-size:11.5px;color:#6b7280;overflow:hidden;text-overflow:ellipsis}
.row .c{font-size:12px;padding:1px 8px}
body.has-sel .row{opacity:.28}
body.has-sel .row.s-self{opacity:1;background:#fffbe8;box-shadow:inset 5px 0 0 #f6b21a}
body.has-sel .row.s-pre{opacity:1;background:#eef4ff;box-shadow:inset 5px 0 0 var(--pre)}
body.has-sel .row.s-post{opacity:1;background:#fff3ea;box-shadow:inset 5px 0 0 var(--post)}
.c.s-w{outline:3px solid #f6b21a}
.wb{padding:6px 0;border-bottom:1px dashed #e2e8f0}
.gd{font-size:12.5px;color:#374151;margin-top:2px;line-height:1.5}.gd b{color:#6b7280;font-size:11.5px;margin-right:4px}.gd.na{color:#9aa3b2}
[data-cat]{cursor:pointer;border-radius:8px;padding:1px 5px}[data-cat].on{outline:2.5px solid #f6b21a;background:#fffbe8}
#fm.on{background:#2a1a00;color:#fff}
body.f-multi main [data-w]:not(.multi){display:none}
.c.dimc{opacity:.18}
body.has-sel #mm .s-on{opacity:1}body.has-sel .row.s-on,body.has-sel .lc.s-on{opacity:1}
@media(max-width:820px){.tr{flex-direction:column;gap:5px}.th{flex:none}.wrap{flex-direction:column}aside{flex:0 0 38vh;border-left:0;border-top:2px solid var(--line)}.legend{display:none}#q{width:130px}}
</style></head>
<body>
<header>
<a class="home" href="./">🏠 목차</a><h1>60차시 학습 어휘 지도</h1>
<div class="tabs"><button id="t-mm" class="on">마인드맵</button><button id="t-flow">위계 흐름</button><button id="t-std">성취기준별</button><button id="t-sec">교과서 소단원별</button></div>
<input id="q" placeholder="낱말 찾기 (예: 지수)" autocomplete="off">
<span class="zoom"><button data-z="1.25">＋</button> <button data-z="0.8">－</button> <button data-z="0">맞춤</button></span>
<button id="clear">선택 해제</button>
<button id="fm" title="두 차시 이상에 나오는 낱말만 남깁니다">2차시 이상 나오는 어휘만</button>
<div class="legend"><span data-cat="new"><i style="background:#19b394"></i>새 어휘 (★ 충남대 핵심어)</span><span data-cat="aux"><i style="background:#c9a24a"></i>함께 보는 말</span><span data-cat="pre"><i style="background:#1e4fb3"></i>먼저 익혀야 하는 차시·낱말</span><span data-cat="post"><i style="background:#c2410c"></i>이 낱말을 다시 쓰는 차시</span></div>
</header>
<div class="wrap">
<main><svg id="mm" viewBox="-740 -740 1480 1480"></svg><div id="flow"><div id="flowin"><svg id="arcs"></svg><div id="rows"></div></div></div><div id="std" class="pg"></div><div id="sec" class="pg"></div></main>
<aside id="panel"></aside>
</div>
<script>

4사분면": {"d": "x좌표는 양수, y좌표는 음수인 사분면", "e": "(1,-3)은 제4사분면 위에 있습니다."}, "변수": {"d": "여러 가지로 변하는 값을 나타내는 문자", "e": "1개에 500원짜리 지우개를 x개 산다고 할 때, 지불해야 하는 총 금액을 y원이라 하면, 구매하는 지우개의 개수에 따라 지불해야 하는 금액이 달라지므로 x와 y는 변수라고 할 수 있습니다."}, "그래프": {"d": "두 변수 x, y의 순서쌍 (x, y)를 좌표평면 위에 점으로 나타낸 것", "e": "두 변수 x, y 사이의 관계가 y=2x일 때, (1, 2), (2, 4), (3, 6), ...과 같이 두 변수의 관계식 y=2x를 만족하는 순서쌍 (x,y)를 모두 좌표평면 위에 나타낼 수 있는데 그것을 그래프라고 합니다."}, "정비례": {"d": "두 변수 x, y에 대하여 x의 값이 2배, 3배, 4배, ...가 됨에 따라 y의 값도 2배, 3배, 4배, ...가 되는 관계", "e": "1권에 1000원인 노트를 x권 샀을 때, 지불해야하는 총 금액을 y원이라 하면, y=1000x가 성립합니다. 산 노트의 권수를 2배, 3배, 4배, ...함에 따라 지불해야하는 금액도 2배, 3배, 4배, ...가 되므로 y는 x에 정비례한다고 할 수 있습니다."}, "반비례": {"d": "두 변수 x, y에 대하여 x의 값이 2배, 3배, 4배, ...가 됨에 따라 y의 값은 ½배, ⅓배, ¼배, ...가 되는 관계", "e": "(시간)=(거리)÷(속력)입니다. 총 120km 떨어진 장소로 일정한 속력 시속 xkm로 이동할 때, 걸리는 시간을 y시간이라 하면 y=120÷x가 성립합니다. 이때, 속력을 2배, 3배, 4배, ...로 함에 따라 걸리는 시간은 ½배, ⅓배, ¼배, ...가 되므로 y는 x에 반비례한다고 할 수 있습니다."}, "지수법칙": {"d": "거듭제곱의 곱셈, 나눗셈, 거듭제곱의 거듭제곱, 곱과 몫의 거듭제곱을 계산할 때 성립하는 규칙", "e": "지수법칙을 이용하여 (x^2)×(x^5)=x^7, (a^2)^3=a^6으로 계산할 수 있습니다."}, "이차식": {"d": "다항식의 차수가 2인 식", "e": "한 변의 길이가 x인 정사각형의 넓이는 x^2이 되는데, 이는 다항식의 차수 즉, 다항식을 이루는 항 중에서 가장 높은 차수가 2이므로 이차식이라고 합니다."}, "전개": {"d": "다항식과 다항식의 곱을 분배법칙을 이용하여 하나의 다항식으로 나타낸 것", "e": "x(a+b)와 같이 단항식과 다항식의 곱셈을 하나의 다항식으로 나타내기 위해서는 분배법칙을 이용하면 ax+bx가 되는데, 이러한 과정을 전개라고 합니다."}, "부등식": {"d": "부등호를 사용하여 두 수 또는 식의 대소 관계를 나타낸 식", "e": "제한 속력이 시속 60km인 도로에서 자동차의 속력을 v라고 하면, v≤60이라는 부등식으로 나타낼 수 있습니다."}, "부등식의 성질": {"d": "부등식의 양변에 같은 수를 더하거나 빼도, 또는 양수를 곱하거나 나누어도 부등호의 방향은 변하지 않지만, 음수를 곱하거나 나누면 부등호의 방향이 반대로 바뀐다는 성질", "e": "부등식의 성질을 이용하면 부등식을 풀이할 수 있습니다 단, 등식의 성질과 달리 양변에 같은 음수를 곱하거나 나누는 경우에는 부등호의 방향이 반대로 바뀐다는 것을 꼭 기억해야 합니다."}, "일차부등식": {"d": "부등식의 모든 항을 좌변으로 정리하였을 때, (일차식)>0, (일차식)<0, (일차식)≤0, (일차식)≥0의 꼴로 나타내어지는 부등식", "e": "1권에 1500원짜리 노트 x권과 1개 5000원짜리 필통을 1개 산 금액이 10000원 이하일 때, 노트를 몇 권 사야하는지 식을 세워보면 1500×x+5000≤10000과 같은 일차부등식입니다."}, "연립(일차)방정식": {"d": "두 개 이상의 일차방정식을 한 쌍으로 묶어 나타낸 것", "e": "철수와 철수 어머니의 나이의 합이 40이고, 두 사람의 나이의 차가 30일 때, 두 사람의 나이를 구하려고 합니다. 철수의 나이를 x세, 철수 어머니의 나이를 y세라고 했을 때, x+y=40, y=x+30이라는 일차방정식을 세울 수 있고, 두 식을 모두 만족하는 해를 찾아야 하므로 연립방정식을 세워 풀 수 있습니다."}, "대입법": {"d": "한 방정식을 한 미지수에 관하여 정리한 후, 이를 다른 방정식에 대입하여 푸는 방법", "e": "x+y=40, y=x+30을 대입법으로 풀이하면, x+y=40에 y대신 y=x+30을 대입하여 y를 소거하면 x+(x+30)=40, 2x=10, x=5입니다. 이를 다시 y=x+30에 x=5를 대입하여 풀이하면 y=35를 구할 수 있습니다."}, "가감법": {"d": "두 방정식의 양변을 더하거나 빼서 한 미지수를 없앤 후 푸는 방법", "e": "x+y=40, -x+y=30을 가감법으로 풀이하면 변끼리 더했을 때 x가 소거되므로 2y=70, y=35이고, 이를 다시 x+y=40에 y=35를 대입하여 풀이하면 x=5를 구할 수 있습니다."}, "소거": {"d": "연립방정식의 풀이 과정에서 한 미지수를 없애는 것", "e": "연립방정식을 풀이할 때에는 대입법 또는 가감법을 활용하여 문자 2개 중 1개를 소거하는 방법을 통해 1개씩 해를 찾아낼 수 있습니다."}, "함수": {"d": "두 변수 x, y에 대하여 x의 값이 하나 정해짐에 따라 y의 값이 오직 하나씩 정해지는 관계", "e": "1권에 1000원짜리 노트 x권을 샀을 때, 총 지불해야하는 금액을 y원이라고 하면, x의 값이 하나 정해짐에 따라 y의 값이 오직 하나씩 정해지므로 y는 x의 함수라고 할 수 있습니다."}, "대응 관계": {"d": "x의 값과 y의 값이 서로 짝지어지는 관계", "e": "1권에 2000원짜리 샤프 x개를 샀을 때, 총 지불해야 하는 금액을 y원이라고 합니다. x값이 1, 2, 3, ...일 때,  y의 값이 각각 2000, 4000, 6000, ...으로 짝지어지므로, x와 y는 대응 관계에 있습니다."}, "함숫값": {"d": "함수 y=f(x)에서 x의 값에 따라 결정되는 y의 값", "e": "함수 y=3x에서 y는 x의 함수이므로 y=f(x)로 나타낼 수 있고, f(2)=3×2=6으로 x=2일 때의 함숫값을 구할 수 있습니다."}, "일차함수": {"d": "y가 x의 함수일 때, y가 x에 관한 일차식으로 나타내어지는 함수", "e": "일차함수는 함수 y=f(x)에서 f(x)가 x에 대한 일차식으로 표현될 때를 말합니다. 예를 들어 y=2x, y=-3x+2 등이 있습니다."}, "평행이동": {"d": "한 도형을 일정한 방향으로 일정한 거리만큼 옮기는 것", "e": "일차함수 y=ax+b의 그래프는 y=ax의 그래프를 y축의 방향으로 b만큼 평행이동했을 때의 그래프입니다. 그래프를 평행이동하면 그래프 위의 모든 점이 일정한 방향으로 일정한 거리만큼 평행이동하니까 모양이 변하지 않습니다."}, "x절편": {"d": "그래프가 x축과 만나는 점의 x좌표", "e": "일차함수 y=2x-4의 그래프의 x절편은 x축과 만나는 점의 x좌표이므로 y=0을 대입했을 때의 x값 즉, 2가 됩니다."}, "y절편": {"d": "그래프가 y축과 만나는 점의 y좌표", "e": "일차함수 y=2x-4의 그래프의 y절편은 y축과 만나는 점의 y좌표이므로 x=0을 대입했을 때의 y값 즉, -4가 됩니다."}, "기울기": {"d": "(y의 값의 증가량)÷(x의 값의 증가량)", "e": "일차함수 y=ax+b의 그래프의 기울기는 a입니다. 기울기 a가 양수이면 오른쪽 위로 향하는 직선, 기울기 a가 음수이면 오른쪽 아래로 향하는 직선이 됩니다."}, "직선의 방정식": {"d": "좌표평면 위의 직선을 나타내는 방정식", "e": "좌표평면 위의 모든 직선은 ax+by+c=0(단, a, b, c는 상수, a≠0 또는 b≠0)의 형태로 나타낼 수 있으며, 이를 직선의 방정식이라고 합니다."}, "각": {"d": "한 점에서 시작하는 두 반직선으로 function intro(){if(fMulti)return showMulti();panel.innerHTML=`<div class="tip"><b>보는 법</b><br>차시나 낱말을 누르면, 그것을 익히기 전에 <b style="color:var(--pre)">먼저 알아야 하는 차시·낱말</b>과 <b style="color:var(--post)">그 낱말을 다시 쓰는 뒤 차시</b>가 표시됩니다. 차시를 누르면 낱말의 뜻과 용례도 나옵니다.<br>위쪽 범례와 아래 ‘어휘의 세 가지’를 누르면 그 종류의 낱말만 강조됩니다.</div>

const CAT={new:['새 어휘','그 소단원에서 처음 나오는 말입니다. 그 차시에서 익힙니다.'],aux:['함께 보는 말','새 어휘와 같이 처음 나오는 낱말입니다.'],pre:['앞에서 배운 말 — 먼저 익혀야 하는 낱말과 차시','뒤 차시에서 다시 쓰이는 낱말과, 그 낱말을 익히는 차시입니다. 뒤 차시에서는 뜻만 확인하고, 모르면 익히는 차시로 돌아갑니다.'],post:['앞에서 배운 낱말을 다시 쓰는 차시','앞 차시의 낱말을 뜻 확인용으로 다시 쓰는 차시입니다.'],elem:['초등에서 배운 말','앞 차시로 보내지 않고, 쓰이는 차시 안에서 배경지식으로 안내합니다.']};

  else{const ws=Object.keys(elem).sort((a,b)=>elem[a].localeCompare(elem[b])||a.localeCompare(b,'ko')),en=[];L.forEach(d=>Object.keys(d.elemNew||{}).forEach(w=>en.push([w,d.elemNew[w],d.no])));

<div class="meta">먼저 보고 배우는 소단원: <b>${esc(d.sub)}</b> ${esc(d.std)}</div>
