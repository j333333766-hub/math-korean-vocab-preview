<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L06 소인수분해 · 쑥쑥이와 한 걸음씩</title>
<!--
  6차시 소인수분해 — 튜토리얼판(안내자가 이끄는 학습). 2026-10-10.
  원래 차시(../index.html)와 같은 내용을, 안내자 '쑥쑥이'가 한 걸음에 할 일 하나씩 이끄는 방식으로 다시 짠 것.
  - 한 화면에 할 일 하나. 해내야 '다음'이 열린다. 틀리면 쑥쑥이가 도움말을 준다.
  - 원칙은 같다: 개념을 다시 가르치지 않고, 문제를 풀게 하지 않는다. 묻는 것은 언제나 낱말이다.
  - 이 파일은 손으로 쓴 것이다(build.py 가 만들지 않는다). 내용은 아래 STEPS 를 고친다.
-->
<style>
:root{--ink:#16202f;--blue:#2f6fe4;--teal:#19b394;--pink:#e23d6d;--yel:#ffd84d;--bg:#eef5fc}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:10px 12px 12px;gap:10px}
/* 위: 어디까지 왔는지 */
.head{display:flex;align-items:center;gap:8px}
.head .ttl{font-weight:900;font-size:15px;white-space:nowrap}
.head .ttl small{font-weight:700;color:#6b7280;margin-left:4px}
.head .sp{flex:1}
.head .mini{border:1.5px solid #c7d2e2;background:#fff;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:800;color:#44506a;text-decoration:none}
.stages{display:flex;gap:4px}
.stages i{flex:1;font-style:normal;text-align:center;font-size:11px;font-weight:800;color:#8a94a6;background:#dde7f3;border-radius:99px;padding:3px 0;white-space:nowrap;overflow:hidden}
.stages i.on{background:var(--blue);color:#fff}.stages i.past{background:#bfe9dc;color:#0a6b55}
.bar{height:8px;background:#dde7f3;border-radius:99px;overflow:hidden}.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#59d6b6);border-radius:99px;transition:width .4s}
/* 안내자 */
.guide{display:flex;align-items:flex-end;gap:8px}
.guide .av{flex:none;width:68px}
.guide .av svg{width:100%;display:block}
.guide .av.hop svg{animation:hop .5s}
.bub{position:relative;flex:1;background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:11px 44px 11px 14px;font-weight:800;font-size:17px;line-height:1.5;min-height:56px;box-shadow:0 3px 0 var(--ink)}
.bub:before{content:"";position:absolute;left:-11px;bottom:16px;border:8px solid transparent;border-right-color:var(--ink);border-left:0}
.bub:after{content:"";position:absolute;left:-7px;bottom:17px;border:7px solid transparent;border-right-color:#fff;border-left:0}
.bub.hint{background:#fff3f0;border-color:#d23a3a;box-shadow:0 3px 0 #d23a3a}.bub.hint:before{border-right-color:#d23a3a}.bub.hint:after{border-right-color:#fff3f0}
.bub.ok{background:#eafaf2;border-color:#0a8f5b;box-shadow:0 3px 0 #0a8f5b}.bub.ok:before{border-right-color:#0a8f5b}.bub.ok:after{border-right-color:#eafaf2}
.bub.pop{animation:pop .3s}
.bub .spk{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);background:#f58a1f;font-size:13px;padding:0}
.hl{color:var(--pink)}
/* 할 일 */
.task{flex:1;background:#fff;border:2.5px solid var(--ink);border-radius:20px;padding:16px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:300px}
.task>*{animation:up .35s both}
.fig{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.eq{font-size:30px;font-weight:900;text-align:center;line-height:1.5}.eq.sm{font-size:22px}.eq small{display:block;font-size:17px;font-weight:800;color:#44506a}
.sentence{font-size:22px;font-weight:900;text-align:center;line-height:1.7;background:#f4f8ff;border:2px dashed #9db8e8;border-radius:14px;padding:10px 14px;width:100%}
.grid{display:grid;gap:4px;font-size:26px;background:#fff4d6;border:2px solid #f0cf73;border-radius:12px;padding:8px 12px}
.nums{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;font-weight:800}
.nums span.n{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;background:#fff}
.nums span.n.on{background:#ffd0de;border-color:var(--pink);color:var(--pink)}
.wb{display:inline-flex;align-items:center;justify-content:center;border:2.5px solid var(--ink);border-radius:14px;padding:6px 16px;font-size:26px;font-weight:900;background:#fff}
.wb.big{font-size:32px}.wb.key{background:#ffd0de;border-color:var(--pink);color:#b3204c}
button.wb.tapme,.tapme{animation:pulse 1.1s infinite}
.row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.sg{font-size:24px;font-weight:900;color:#f58a1f}
.parts{display:flex;align-items:center;gap:10px;max-height:0;opacity:0;overflow:hidden;transition:.5s}
.parts.open{max-height:90px;opacity:1}.parts.open .wb:first-child{animation:fromR .5s both}.parts.open .wb:last-child{animation:fromL .5s both}
.join .res{opacity:0;transform:scale(.3);transition:.4s}.join.done .res{opacity:1;transform:none}
.join .wb.on{background:#fff1b8}
.pics{display:flex;gap:8px;width:100%;justify-content:center;flex-wrap:wrap}
.pic{flex:1 1 30%;min-width:120px;border:2.5px solid var(--ink);border-radius:14px;background:#fff8e1;padding:10px 6px;text-align:center;font-weight:800;font-size:15px;line-height:1.4}
.pic .e{font-size:38px;line-height:1.2}.pic .s{visibility:hidden}.pic.on{background:#eafaf2}.pic.on .s{visibility:visible}
.flow{display:flex;align-items:center;justify-content:center;gap:10px;font-size:24px;font-weight:900}
.flow span{border:2.5px solid var(--ink);border-radius:12px;padding:4px 14px;background:#fff}.flow span.r{background:#ffd0de;border-color:var(--pink)}
.cap{font-size:15px;font-weight:800;color:#44506a;text-align:center}
.pw{display:flex;align-items:flex-start;justify-content:center;gap:2px;font-weight:900;line-height:1;position:relative;padding:6px 70px 34px}
.pw .b{font-size:84px}.pw .e{font-size:44px;color:var(--pink)}
.pw .lb{position:absolute;font-size:17px;font-weight:900;opacity:0;transition:.5s}.pw.lab .lb{opacity:1}
.pw .lb.l1{left:50%;bottom:4px;transform:translateX(-90%)}.pw .lb.l2{right:4px;top:14px;color:var(--pink)}
svg.tree{width:210px;max-width:70%}
/* 보기 */
.opts{display:grid;gap:8px;width:100%;max-width:440px}
.opt{border:2.5px solid var(--ink);background:#fff;border-radius:14px;padding:11px 10px;font-weight:900;font-size:19px;text-align:center;transition:.12s}
.opt:active{transform:translateY(2px)}.opt.right{background:#c9f2df;border-color:#0a8f5b}.opt.wrong{background:#fbd0d0;animation:shake .3s}.opt.sel{background:#ffe9a6}
.opt:disabled{color:inherit;opacity:1;cursor:default}.opt.m0{background:#ffd9e4}.opt.m1{background:#d6e8ff}.opt.m2{background:#d5f5e1}
.oxr{display:flex;gap:28px}.oxr .opt{width:96px;height:96px;border-radius:50%;font-size:44px;padding:0}.oxr .opt:first-child{color:var(--blue)}.oxr .opt:last-child{color:#e24b4b}
.type{width:100%;max-width:520px;display:flex;flex-direction:column;gap:8px}
.tprow{display:flex;align-items:center;gap:10px;border:2.5px solid var(--ink);border-radius:14px;padding:8px 10px;background:#fff;font-size:19px;font-weight:900;line-height:2}
.tprow .tx{flex:1}.tprow .mk{color:#0a8f5b;font-weight:900;visibility:hidden}.tprow .mk.on{visibility:visible}
.play{flex:none;width:38px;height:38px;border-radius:50%;border:2.5px solid var(--ink);background:#2e9de0;color:#fff;font-size:15px;padding:0 0 0 2px}
input.in{font:inherit;font-weight:900;font-size:max(1em,16px);border:2.5px solid var(--ink);border-radius:10px;padding:2px 6px;text-align:center;background:#fffbe8;color:#b3204c;max-width:100%;margin:0 4px}
input.in.ok{background:#c9f2df;border-color:#0a8f5b;color:#0a6b45}
.blank{display:inline-block;min-width:5.2em;min-height:1.5em;border:2.5px dashed var(--ink);border-radius:10px;background:#fffbe8;margin:0 4px;vertical-align:middle;text-align:center;color:#b3204c;cursor:pointer}
.blank.f{border-style:solid}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{border:2.5px solid var(--ink);background:#fff;border-radius:99px;padding:6px 16px;font-weight:900;font-size:18px}
.chip.used{opacity:.3;pointer-events:none}.chip.pick{background:#ffe9a6;outline:3px solid var(--blue)}
.match{display:flex;gap:6%;width:100%}.match .col{flex:1;display:flex;flex-direction:column;gap:8px}.match .opt{font-size:16px;padding:9px 6px}
.lgbar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.lgb{border:2px solid var(--ink);background:#fff;border-radius:99px;padding:4px 13px;font-weight:800;font-size:15px}.lgb.on{background:var(--teal);color:#fff}
.cards{display:flex;gap:8px;width:100%}
.cd{flex:1;border:2.5px solid var(--ink);border-radius:14px;background:#fff1b8;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;cursor:pointer}
.cd .slot{width:100%;min-height:34px;border:2px dashed var(--ink);border-radius:10px;background:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;color:#9ca3af}
.cd .eg{font-weight:900;font-size:16px}.cd .df{font-size:13px;font-weight:700;color:#44506a;line-height:1.4}
.cd.ok{background:#c9f2df;cursor:default}.cd.ok .slot{border-style:solid;color:#0a6b45}.cd.no{animation:shake .3s}
.wcards{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.wc{flex:1 1 28%;min-width:130px;border:2.5px solid var(--ink);border-radius:16px;background:#fff1b8;padding:14px 6px;text-align:center;font-weight:900;font-size:22px}
.wc small{display:block;font-size:13px;font-weight:800;color:#6b7280;margin-top:4px}.wc.on{background:#c9f2df}.wc.on small{color:#0a6b45}
.ck{width:100%;display:flex;flex-direction:column;gap:8px}
.ckr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:2.5px solid var(--ink);border-radius:14px;padding:8px 10px}
.ckr .w{font-weight:900;font-size:19px;min-width:5.5em}.ckr .d{flex:1 1 9em;font-size:14px;font-weight:700;color:#44506a}
.ckr button{border:2px solid var(--ink);background:#fff;border-radius:99px;padding:4px 12px;font-weight:800;font-size:14px}
.ckr button.y.on{background:#c9f2df}.ckr button.n.on{background:#fbd0d0}
.ckr .go{flex:1 1 100%;border:0;background:none;padding:0;text-align:left;color:#1e4fb3;text-decoration:underline;font-size:14px;font-weight:800}
.fin{text-align:center;font-size:54px}
.note{font-size:14px;font-weight:700;color:#6b7280;text-align:center}
/* 아래: 앞·뒤 */
.foot{display:flex;gap:10px}
.foot button{border:2.5px solid var(--ink);border-radius:16px;padding:12px 18px;font-weight:900;font-size:18px;background:#fff;box-shadow:0 3px 0 var(--ink)}
.foot .next{flex:1;background:var(--yel)}.foot .next:disabled{background:#e6e9ef;color:#9aa3b2;border-color:#b9c0cc;box-shadow:none;cursor:default}
.foot .next.go{animation:pulse 1.1s infinite}.foot .prev:disabled{opacity:.35;cursor:default}
@keyframes pulse{0%{box-shadow:0 0 0 0 #ffb300cc}100%{box-shadow:0 0 0 14px #ffb30000}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.94)}to{transform:none}}
@keyframes hop{40%{transform:translateY(-10px)}}
@keyframes fromL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes fromR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@media(max-width:520px){.bub{font-size:15.5px}.guide .av{width:54px}.eq{font-size:25px}.sentence{font-size:19px}.wb{font-size:22px}.wb.big{font-size:27px}.opt{font-size:17px}.cards{flex-direction:column}.head .ttl small{display:none}.tprow{font-size:17px}.oxr .opt{width:84px;height:84px}}
</style>
</head>
<body>
<div class="app">
  <div class="head"><div class="ttl">L06 소인수분해<small>쑥쑥이와 한 걸음씩</small></div><div class="sp"></div><a class="mini" href="../">원래 차시</a><button class="mini" id="restart">↺ 처음부터</button></div>
  <div class="stages" id="stages"></div>
  <div class="bar"><b id="bar"></b></div>
  <div class="guide"><div class="av" id="av"></div><div class="bub" id="bub"><span id="say"></span><button class="spk" id="spk" title="듣기">🔊</button></div></div>
  <div class="task" id="task"></div>
  <div class="foot"><button class="prev" id="prev">◀</button><button class="next" id="next" disabled>다음 ▶</button></div>
</div>
<script>
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{ const e=document.createElement(t); if(c) e.className=c; if(h!=null) e.innerHTML=h; return e; };
const rich=t=>String(t).replace(/\*\*(.+?)\*\*/g,'<b class="hl">$1</b>').replace(/\n/g,'<br>');
const plain=t=>String(t).replace(/\*\*/g,'').replace(/<[^>]+>/g,' ');
function speak(t){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(plain(t)); u.lang='ko-KR'; u.rate=.9; speechSynthesis.speak(u); }catch(e){} }
const STAGES=['도입','어휘 제시','정의','용례','연습','마무리'];
const AV=`<svg viewBox="0 0 100 110"><ellipse cx="50" cy="104" rx="30" ry="5" fill="#0002"/><path d="M50 42 C50 22 36 12 22 12 C22 30 34 40 50 42Z" fill="#3ccf8e" stroke="#16202f" stroke-width="3" stroke-linejoin="round"/><path d="M50 42 C52 24 66 16 80 18 C78 34 66 42 50 42Z" fill="#7be0b0" stroke="#16202f" stroke-width="3" stroke-linejoin="round"/><circle cx="50" cy="70" r="32" fill="#ffe08a" stroke="#16202f" stroke-width="3"/><circle cx="39" cy="66" r="4.2" fill="#16202f"/><circle cx="61" cy="66" r="4.2" fill="#16202f"/><circle cx="40.4" cy="64.6" r="1.4" fill="#fff"/><circle cx="62.4" cy="64.6" r="1.4" fill="#fff"/><ellipse cx="31" cy="76" rx="5" ry="3.2" fill="#ff9aa8"/><ellipse cx="69" cy="76" rx="5" ry="3.2" fill="#ff9aa8"/><path d="M42 77 Q50 86 58 77" fill="#c2414f" stroke="#16202f" stroke-width="2.5" stroke-linejoin="round"/></svg>`;

/* ---------- 그림 ---------- */
const box=(...kids)=>{ const d=el('div','fig'); kids.forEach(k=>d.append(typeof k==='string'?el('div','',k):k)); return d; };
const eq=(t,sub,sm)=>el('div','eq notranslate'+(sm?' sm':''),rich(t)+(sub?'<small>'+rich(sub)+'</small>':''));
const sent=t=>el('div','sentence notranslate',rich(t));
const cap=t=>el('div','cap',rich(t));
const grid=(e,n,cols,label)=>{ const r=el('div','row'); const g=el('div','grid'); g.style.gridTemplateColumns=`repeat(${cols},1fr)`; g.innerHTML=Array(n).fill('<span>'+e+'</span>').join(''); r.append(g); if(label) r.append(el('div','eq sm notranslate',label)); return r; };
const nums=(label,items,on)=>{ const r=el('div','nums notranslate'); if(label) r.append(el('span','',rich(label))); items.forEach(n=>r.append(el('span','n'+((on||[]).includes(n)?' on':''),n))); return r; };
const wb=(t,cls)=>el('span','wb notranslate '+(cls||''),t);
const flow=(a,b,c)=>{ const d=el('div','fig'); d.style.gap='4px'; d.append(el('div','flow notranslate',`<span>${a}</span><b class="sg">→</b><span class="r">${b}</span>`)); if(c) d.append(cap(c)); return d; };
function tree(n,eqs){ let x=110,y=26,m=n; const dx=52,dy=50,N=[{x,y,t:m}],E=[];
  while(true){ let q=2; while(m%q) q++; if(q===m) break; const A={x:x-dx,y:y+dy,t:q,p:1},B={x:x+dx,y:y+dy,t:m/q}; E.push([x,y,A.x,A.y],[x,y,B.x,B.y]); N.push(A,B); x=B.x; y=B.y; m/=q; }
  N[N.length-1].p=1; const H=y+30, W=Math.max(...N.map(d=>d.x))+34; let g='';
  E.forEach(e=>g+=`<line x1="${e[0]}" y1="${e[1]+13}" x2="${e[2]}" y2="${e[3]-18}" stroke="#16202f" stroke-width="2.5"/>`);
  N.forEach(d=>{ if(d.p) g+=`<circle cx="${d.x}" cy="${d.y}" r="17" fill="#ffd0de" stroke="#e23d6d" stroke-width="2.5"/>`; g+=`<text x="${d.x}" y="${d.y+7}" text-anchor="middle" font-size="21" font-weight="800">${d.t}</text>`; });
  const d=el('div','fig'); d.innerHTML=`<svg class="tree notranslate" viewBox="24 0 ${W-24} ${H}">${g}</svg>`; if(eqs) d.append(eq(eqs,null,true)); return d; }
const power=(lab)=>{ const d=el('div','fig'); d.innerHTML=`<div class="pw notranslate${lab?' lab':''}"><span class="b">2</span><span class="e">3</span><span class="lb l1">│<br>밑</span><span class="lb l2">── 지수</span></div>`; d.append(eq('2 × 2 × 2 = 2³',null,true)); return d; };

/* ---------- 할 일의 종류 ---------- */
// 고르기(answer 가 null 이면 정답 없이 고르기만 한다). fig: 처음 그림, after: 맞힌 뒤 바뀌는 그림
function choice(o){ return (host,api)=>{ const slot=el('div','fig'); if(o.fig) slot.append(o.fig()); host.append(slot);
  const g=el('div',o.ox?'oxr':'opts'); (o.ox?['O','X']:o.options).forEach((t,k)=>{ const b=el('button','opt notranslate',rich(t));
    b.onclick=()=>{ if(api.isDone()) return; if(o.answer==null||k===o.answer){ b.classList.add('right'); if(o.after){ slot.innerHTML=''; slot.append(o.after()); } api.done(o.answer==null?o.replies[k]:(o.ok||'맞아요!')); }
      else { b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); api.hint(o.hint||'다시 골라 봐요.'); } }; g.append(b); }); host.append(g); }; }
// 낱말을 눌러 쪼개기
function split(whole,parts,ok,extra){ return (host,api)=>{ const b=el('button','wb big key tapme notranslate',whole), p=el('div','parts notranslate'); p.append(wb(parts[0]),el('b','sg','+'),wb(parts[1]));
  b.onclick=()=>{ if(api.isDone()) return; b.classList.remove('tapme'); p.classList.add('open'); speak(parts[0]+', '+parts[1]); api.done(ok); };
  host.append(b,el('b','sg','▼'),p); if(extra) host.append(extra()); }; }
// 조각 두 개를 눌러 붙이기
function join(parts,result,ok,fig){ return (host,api)=>{ if(fig) host.append(fig()); const r=el('div','row join notranslate'); const a=el('button','wb tapme',parts[0]), b=el('button','wb tapme',parts[1]), res=el('span','wb key res',result);
  const chk=()=>{ if(a.classList.contains('on')&&b.classList.contains('on')&&!api.isDone()){ r.classList.add('done'); speak(result); api.done(ok); } };
  [a,b].forEach(x=>x.onclick=()=>{ x.classList.add('on'); x.classList.remove('tapme'); chk(); }); r.append(a,el('b','sg','+'),b,el('b','sg','→'),res); host.append(r); }; }
// 카드를 하나씩 눌러 보기
function reveal(items,ok,cls){ return (host,api)=>{ const w=el('div',cls==='wc'?'wcards':'pics'); let left=items.length;
  items.forEach(it=>{ const c=el('button',(cls||'pic')+' tapme notranslate',cls==='wc'?rich(it.t)+'<small>눌러서 듣기</small>':`<div class="e">${it.e}</div><div class="s">${rich(it.s)}</div>`);
    c.onclick=()=>{ speak(it.say||it.s||it.t); if(c.classList.contains('on')) return; c.classList.add('on'); c.classList.remove('tapme'); if(cls==='wc') c.querySelector('small').textContent='✓ 들었어요'; if(!--left) api.done(ok); }; w.append(c); }); host.append(w); }; }
// 듣고 쓰기. text 에 {0} 이 있으면 문장 속 빈칸, 없으면 낱말을 보고 쓰기
function typing(items,ok){ return (host,api)=>{ const w=el('div','type'); const norm=v=>String(v).replace(/\s/g,''); let n=0;
  items.forEach(it=>{ const r=el('div','tprow notranslate'), p=el('button','play','▶'), tx=el('span','tx'), inp=el('input','in'), mk=el('span','mk','✓'); let hit=false;
    inp.autocomplete='off'; inp.spellcheck=false; inp.setAttribute('aria-label','낱말 쓰기'); inp.style.width=(it.answer.length*1.3+1.6)+'em'; p.onclick=()=>speak(it.say||it.text.replace('{0}',it.answer));

  body:choice({fig:()=>box(sent('2 × 2 × 2를 **거듭제곱으로 나타내면**\n2³ 이다.')), ox:1, answer:0, ok:'맞아요! ‘~을 거듭제곱으로 나타내면 ~이다’라고 써요.', hint:'같은 수 2를 여러 번 곱한 것을 나타냈어요.'})},
{s:3, say:'문제는 이렇게 끝나요. 이 문제는 **무엇을 하라는 말**일까요?',
  body:choice({fig:()=>box(sent('다음 수를\n**소인수분해하시오**.')), options:['소인수들만의 곱으로 나타내라는 말','약수를 모두 더하라는 말','3으로 나누라는 말'], answer:0, ok:'맞아요! ‘~하시오’는 무엇을 하라고 시키는 말이에요.', hint:'‘소인수분해’의 뜻을 떠올려 봐요.'})},
{s:3, say:'▶를 눌러 문장을 듣고, **빈칸에 들어갈 낱말**을 써요.',
  body:typing([{text:'12의 {0}는 2와 3입니다.',answer:'소인수',say:'십이의 소인수는 이와 삼입니다.'},{text:'12를 {0}하면 2² × 3입니다.',answer:'소인수분해',say:'십이를 소인수분해하면 이의 제곱 곱하기 삼입니다.'}],'잘 들었어요! 받아쓰기 성공이에요.')},
{s:3, say:'아래 낱말을 **눌러서 빈칸에 넣어요.** 잘못 넣었으면 빈칸을 눌러 빼요.',
  body:fill({fig:()=>tree(18,'18 = 2 × 3²'), sentence:'18을 {0}하면 2 × 3²입니다.\n18의 {1}는 2와 3입니다.', options:['소인수','거듭제곱','소인수분해'], answer:[2,0], ok:'맞아요! 두 낱말을 알맞게 넣었어요.'})},
// ── 연습
{s:4, say:'이제 연습이에요. 그림처럼 나타내는 것을 무엇이라고 하나요?',
  body:choice({fig:()=>tree(12,'12 = 2 × 2 × 3'), options:['소인수분해','거듭제곱','약수'], answer:0, hint:'자연수를 소인수들만의 곱으로 나타냈어요.'})},
{s:4, say:'색이 들어간 수 2와 3을 12의 무엇이라고 하나요?',
  body:choice({fig:()=>box(eq('12 = **2** × **2** × **3**')), options:['소인수','거듭제곱','합성수'], answer:0, hint:'‘소수인 인수’를 줄인 말이에요.'})},
{s:4, say:'2³처럼 나타낸 것을 무엇이라고 하나요?',
  body:choice({fig:()=>power(false), options:['소인수','거듭제곱','소인수분해'], answer:1, hint:'같은 수를 여러 번 곱한 것이에요.'})},
{s:4, say:'이 문장이 **맞으면 O, 틀리면 X**를 눌러요.',
  body:choice({fig:()=>box(eq('12 = 2² × 3'),sent('2와 3을 12의 ‘거듭제곱’이라고 한다.')), ox:1, answer:1, ok:'맞아요! 2와 3은 12의 ‘소인수’예요.', hint:'2와 3은 12의 무엇이었는지 떠올려 봐요.'})},
{s:4, say:'낱말과 뜻을 이어요. **왼쪽 낱말을 누르고, 알맞은 뜻을 오른쪽에서 눌러요.**',
  body:match(W3,['소수인 인수','자연수를 소인수들만의 곱으로 나타내는 것','같은 수를 여러 번 곱한 것'],'세 낱말의 뜻을 모두 이었어요!')},
{s:4, say:'마지막 받아쓰기예요. 이번에는 낱말을 보지 않고, **듣고 써요.**',
  body:typing([{text:'18의 {0}는 2와 3입니다.',answer:'소인수',say:'십팔의 소인수는 이와 삼입니다.'},{text:'18을 {0}하면 2 × 3²입니다.',answer:'소인수분해',say:'십팔을 소인수분해하면 이 곱하기 삼의 제곱입니다.'},{text:'2 × 2 × 2를 {0}으로 나타내면 2³입니다.',answer:'거듭제곱',say:'이 곱하기 이 곱하기 이를 거듭제곱으로 나타내면 이의 세제곱입니다.'}],'세 낱말을 모두 썼어요! 거의 다 왔어요.')},
// ── 마무리
{s:5, say:'오늘 익힌 낱말을 정리해요. **아래 낱말을 누른 다음, 알맞은 카드를 눌러요.**',
  body:recall([{t:'소인수',eg:'12의 소인수: 2, 3',def:'소수인 인수'},{t:'소인수분해',eg:'12 = 2² × 3',def:'자연수를 소인수들만의 곱으로 나타내는 것'},{t:'거듭제곱',eg:'2 × 2 × 2 = 2³',def:'같은 수를 여러 번 곱한 것'}],'오늘의 낱말 3개를 모두 정리했어요!')},
{s:5, say:'스스로 점검해 봐요. 낱말마다 **‘알아요’ 또는 ‘다시 볼래요’**를 눌러요.',
  body:selfcheck([{t:'소인수',def:'소수인 인수',back:'w1'},{t:'소인수분해',def:'자연수를 소인수들만의 곱으로 나타내는 것',back:'w2'},{t:'거듭제곱',def:'같은 수를 여러 번 곱한 것',back:'w3'}])},
{s:5, last:1, say:'끝까지 왔어요! 학교 수업에서 ‘**소인수**’, ‘**소인수분해**’, ‘**거듭제곱**’이라는 말이 나오면 오늘 익힌 것을 떠올려요. 다음에는 7차시 ‘최대공약수’에서 만나요.',
  body:(h,api)=>{ h.append(el('div','fin','🎉'),el('div','row notranslate',W3.map(w=>`<span class="wb key">${w}</span>`).join('')),el('div','note','학교 수업: 중학교 1학년 1학기 ‘소인수분해’ 단원')); api.done(); }}
];

/* ---------- 진행 ---------- */
const KEY='vocabtut:L06'; let cur=0, maxDone=0, done=false, sayText='';
try{ const v=JSON.parse(localStorage.getItem(KEY)||'{}'); cur=Math.min(STEPS.length-1,v.cur||0); maxDone=v.max||0; }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify({cur,max:maxDone})); }catch(e){} };
function bubble(t,cls){ sayText=t; const b=$('#bub'); b.className='bub pop '+(cls||''); $('#say').innerHTML=rich(t); const a=$('#av'); a.classList.remove('hop'); void a.offsetWidth; if(cls==='ok') a.classList.add('hop'); }
const api={ isDone:()=>done, say:t=>bubble(t), hint:t=>bubble(t,'hint'),
  done:t=>{ done=true; if(t) bubble(t,'ok'); maxDone=Math.max(maxDone,cur+1); save(); const n=$('#next'); n.disabled=false; if(!STEPS[cur].last) n.classList.add('go'); } };
function show(){ try{ speechSynthesis.cancel(); }catch(e){} const st=STEPS[cur]; done=false; const t=$('#task'); t.innerHTML=''; bubble(st.say);
  [...$('#stages').children].forEach((x,i)=>{ x.className=i===st.s?'on':(i<st.s?'past':''); }); $('#bar').style.width=(cur/(STEPS.length-1)*100)+'%';
  const n=$('#next'); n.classList.remove('go'); n.disabled=!(cur<maxDone); n.textContent=st.last?'끝! 🎉':'다음 ▶'; $('#prev').disabled=cur===0; if(st.last) n.disabled=true;
  st.body(t,api); if(st.last) n.disabled=true; save(); window.scrollTo(0,0); history.replaceState(null,'','#'+(cur+1)); }
function goto(i){ if(i<0||i>=STEPS.length) return; cur=i; show(); }
STAGES.forEach(s=>$('#stages').append(el('i','',s))); $('#av').innerHTML=AV;
$('#next').onclick=()=>{ if(!$('#next').disabled) goto(cur+1); }; $('#prev').onclick=()=>goto(cur-1); $('#spk').onclick=()=>speak(sayText);
{ const r=$('#restart'); let arm=0; r.onclick=()=>{ if(!arm){ arm=1; r.textContent='한 번 더 누르면 처음으로'; setTimeout(()=>{ arm=0; r.textContent='↺ 처음부터'; },3000); return; } arm=0; r.textContent='↺ 처음부터'; cur=0; maxDone=0; save(); show(); }; }
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT') return; if(e.key==='Enter'||e.key==='ArrowRight') $('#next').click(); if(e.key==='ArrowLeft') $('#prev').click(); });
{ const h=location.hash.match(/#(\d+)/); if(h){ cur=Math.min(STEPS.length-1,h[1]-1); if(/all/.test(location.hash)) maxDone=STEPS.length; } }   // #12 = 12번째 걸음부터 보기, #12all = 모든 걸음을 열어 두고 보기(검토용)
window.onerror=(m,s,l)=>{ document.title='ERR '+m+' @'+l; };
show();
</script>
